resolver 127.0.0.11 valid=5s ipv6=off;
resolver_timeout 2s;

upstream api_backend {
    zone api_backend 64k;
    server api:8000 resolve max_fails=1 fail_timeout=5s;
}

upstream bot_backend {
    zone bot_backend 64k;
    server bot:8001 resolve max_fails=1 fail_timeout=5s;
}

upstream web_backend {
    zone web_backend 64k;
    server web:3000 resolve max_fails=1 fail_timeout=5s;
}

log_format upstream_details
    '$time_iso8601 "$request_method $uri" status=$status '
    'upstream=$upstream_addr upstream_status=$upstream_status '
    'request_time=$request_time upstream_time=$upstream_response_time';

map $http_x_forwarded_proto $forwarded_proto {
    default $scheme;
    https https;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 8m;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header Connection "";

    proxy_connect_timeout 1s;
    proxy_read_timeout 120s;

    access_log /dev/stdout upstream_details;

    proxy_next_upstream error timeout;
    proxy_next_upstream_tries 2;

    location /api/ {
        proxy_pass http://api_backend;
    }

    location = /telegram/webhook {
        proxy_pass http://bot_backend;
    }

    location / {
        proxy_pass http://web_backend;
    }
}
