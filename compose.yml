services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    # Комьюнити сборка закреплённого исходного релиза MinIO
    image: derklaro/minio:RELEASE.2025-10-15T17-29-55Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio-local}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change-me-local-only}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data

  api:
    build:
      context: ./apps/api
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-catalog}
      POSTGRES_USER: ${POSTGRES_USER:-catalog}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-local-only}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"

      S3_ENDPOINT_URL: http://minio:9000
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-catalog-images}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
      S3_REGION: ${S3_REGION:-us-east-1}

      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?API_SERVICE_TOKEN is required}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      API_LOG_DIR: /app/logs/api
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
    ports:
      - "127.0.0.1::8000"
    volumes:
      - api_logs:/app/logs/api
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started

  bot:
    build: 
      context: ./apps/bot
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?TELEGRAM_BOT_TOKEN is required}
      TELEGRAM_ADMIN_ID: ${TELEGRAM_ADMIN_ID:?TELEGRAM_ADMIN_ID is required}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET:?TELEGRAM_WEBHOOK_SECRET is required}

      API_BASE_URL: http://api:8000
      API_SERVICE_TOKEN: ${API_SERVICE_TOKEN:?API_SERVICE_TOKEN is required}
      MINI_APP_URL: ${MINI_APP_URL:?MINI_APP_URL is required}

      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_TO_FILE: ${LOG_TO_FILE:-true}
      BOT_LOG_DIR: /app/logs/bot
      LOG_MAX_BYTES: ${LOG_MAX_BYTES:-10485760}
      LOG_MAX_FILES: ${LOG_MAX_FILES:-5}
    ports:
      - "127.0.0.1::8001"
    volumes:
      - bot_logs:/app/logs/bot
    depends_on:
      api:
        condition: service_started

volumes:
  postgres_data:
  minio_data:
  api_logs:
  bot_logs:
